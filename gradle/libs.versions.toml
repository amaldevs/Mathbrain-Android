[versions]
agp = "9.2.1"
appcompat = "1.7.1"
coreSplashscreen = "1.2.0"
playServicesAds = "24.6.0"
junit = "4.13.2"
robolectric = "4.16.1"
androidxTestCore = "1.7.0"
